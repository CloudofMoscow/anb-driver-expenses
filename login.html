<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Вход · ANB</title>
    <link rel="manifest" href="./manifest.webmanifest?v=55">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <link rel="stylesheet" href="./styles.css?v=55">
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-card">
        <div class="auth-brand">
          <span class="brand-mark"><img src="./anb-logo.svg" alt="ANB Group"></span>
          <div>
            <p class="eyebrow">ANB Group</p>
            <h1>Управление автопарком</h1>
          </div>
        </div>
        <form id="loginForm" class="portal-form" autocomplete="on">
          <label>
            <span>Логин</span>
            <input id="login" name="login" autocomplete="username" required autofocus>
          </label>
          <label>
            <span>Пароль</span>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </label>
          <button class="primary-action" id="loginButton" type="submit">Войти</button>
        </form>
        <p class="auth-note">Все данные защищены.</p>
      </section>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./login.js?v=55" type="module"></script>
  </body>
</html>
